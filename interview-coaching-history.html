<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Interview Coaching History</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f7fa;margin:0;color:#182535}header{background:#123052;color:#fff;padding:18px 24px}main{max-width:1100px;margin:22px auto;padding:0 16px}.card{background:#fff;padding:18px;border-radius:12px;margin-bottom:16px}input,button{padding:10px;border-radius:8px;border:1px solid #ccd3da}button{background:#137877;color:#fff;border:0;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body>
<header><h2>TIB ACADEMY — INTERVIEW COACHING HISTORY</h2></header><main><div class="card"><p>Staff view of saved interview attempts and readiness progression.</p><button onclick="load()">Refresh</button><div style="overflow:auto"><table><thead><tr><th>Date</th><th>User</th><th>Track</th><th>Questions</th><th>Average</th><th>Readiness</th><th>Areas</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script>const sb=supabase.createClient('https://blfgwysgekfqhcafofhe.supabase.co','sb_publishable_ThLetpd4hj49fjce-kXoFA_v4ghwIqV');
async function load(){const {data,error}=await sb.from('interview_coaching_attempts').select('completed_at,user_id,track,question_count,average_score,readiness,area_scores').order('completed_at',{ascending:false}).limit(200);if(error){rows.innerHTML='<tr><td colspan=7>'+error.message+'</td></tr>';return}rows.innerHTML=(data||[]).map(x=>`<tr><td>${new Date(x.completed_at).toLocaleString()}</td><td>${x.user_id.slice(0,8)}…</td><td>${x.track}</td><td>${x.question_count}</td><td>${x.average_score}</td><td>${x.readiness}</td><td>${Object.entries(x.area_scores||{}).map(([k,v])=>'A'+k+': '+v).join(', ')}</td></tr>`).join('')||'<tr><td colspan=7>No attempts yet.</td></tr>'}load();</script></body></html>
